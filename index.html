<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ms. Ainaa’s Learning Room — BM Tahun 1 Unit 1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5ff;color:#293047}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:18px}.top{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 25px #0000000d;margin-bottom:16px}.brand{font-weight:800;color:#7868df}.sub{color:#777b8f}.journey{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.step{padding:8px 12px;border-radius:999px;background:#eeeefa;color:#70748a;font-size:13px}.step.active{background:#8c7be8;color:#fff}.screen{background:#fff;border-radius:26px;padding:24px;box-shadow:0 8px 25px #0000000d}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:0;background:#faf9ff;border-radius:20px;padding:18px;text-align:left;cursor:pointer}.card:hover{transform:translateY(-2px)}.btn{border:0;border-radius:14px;padding:12px 18px;background:#8c7be8;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#ece9fb;color:#5148a5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.learn{background:#f4f0ff;border-radius:18px;padding:18px;margin:14px 0;line-height:1.65}.q{margin:15px 0;padding:18px;background:#faf9ff;border-radius:18px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.opt{background:#fff;border:2px solid #e8e6f2;border-radius:14px;padding:12px;cursor:pointer}.opt.correct{border-color:#62b989;background:#eaf9f0}.opt.wrong{border-color:#e98b9d;background:#fff0f3}.feedback{min-height:24px;font-weight:700;margin-top:10px}.progress{height:12px;background:#e9e8f0;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8c7be8;width:0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{background:#f1effc;border-radius:999px;padding:8px 12px}.big{font-size:38px}.center{text-align:center}.badge{display:inline-block;background:#fff8dc;border-radius:18px;padding:16px;margin:8px}.footer{text-align:center;color:#8a8da0;padding:25px;font-size:13px}@media(max-width:650px){.cards,.opts{grid-template-columns:1fr}.screen{padding:18px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">MS. AINAA’S LEARNING ROOM</div><h1>📖 Bahasa Melayu Tahun 1</h1><div class="sub">Tema 1: Keluarga Penyayang · Unit 1: Keluargaku Sayang</div><div class="stats"><span class="pill">⭐ <b id="stars">0</b> Bintang</span><span class="pill">🏆 <b id="done">0</b> Aktiviti selesai</span><span class="pill">📊 <b id="pct">0</b>%</span></div><div class="progress"><div class="fill" id="bar"></div></div><div class="journey" id="journey"></div></header>
<main class="screen" id="app"></main><div class="footer">Learn • Explore • Grow · Ms. Ainaa’s Learning Room</div></div>
<script>
const phases=[['learn','📖 Learn'],['practice','🎯 Practise'],['play','🎮 Play'],['think','🧠 Think'],['challenge','⭐ Challenge'],['checkpoint','📝 Checkpoint'],['reward','🏆 Reward']];
const data={
learn:[
['Vokal','Huruf vokal ialah a, e, i, o dan u. Cuba sebut satu demi satu.','A E I O U'],
['Konsonan','Huruf selain vokal ialah konsonan. Contohnya b, d, k, m dan s.','B D K M S'],
['Suku kata','Kita boleh membaca perkataan dengan memecahkannya kepada suku kata. Contoh: ba-ju, bu-ku, su-su.','ba · ju · bu · ku · su'],
['Perkataan','Baca perkataan mudah berkaitan kehidupan harian.','ibu · ayah · buku · baju · bola · topi'],
['Ayat mudah','Baca ayat pendek dengan sebutan yang jelas.','Ini ibu. · Ini buku. · Saya sayang keluarga.']
],
practice:[
['Pilih semua vokal',['a','b','e','m','i','o'],'a,e,i,o'],
['Huruf awal bagi "buku"?',['b','d','k','u'],'b'],
['Lengkapkan: b _ ju',['a','e','i','o'],'a'],
['Lengkapkan: b _ ku',['a','e','i','o'],'u'],
['Pilih perkataan yang betul',['buku','buka','beko','bika'],'buku'],
['Pilih perkataan yang mempunyai 2 suku kata',['ibu','bola','baju','semut'],'ibu'],
['Pilih konsonan',['a','e','m','i'],'m'],
['Lengkapkan: _bu',['i','a','o','u'],'i'],
['Huruf akhir "baju"?',['a','j','u','b'],'u'],
['Pilih ayat yang lengkap',['Ini ibu.','Ini ibu','ibu Ini.','Ini. ibu'],'Ini ibu.']
],
play:[
['🎮 Tangkap Vokal','Cari huruf vokal dalam pilihan ini.',['A','B','D','K'],'A'],
['🎮 Tangkap Vokal','Cari huruf vokal dalam pilihan ini.',['M','S','O','T'],'O'],
['🎮 Cari Konsonan','Cari huruf konsonan.',['A','I','U','B'],'B'],
['🎮 Bina Suku Kata','Pilih suku kata yang melengkapkan "ba__".',['ju','ki','mo','se'],'ju'],
['🎮 Bina Perkataan','Pilih perkataan yang terbina daripada ba + ju.',['baju','buku','bola','bapa'],'baju']
],
think:[
['Situasi keluarga','Adik mahu membantu ibu. Apakah tindakan yang sesuai?',['Membantu ibu','Menyepahkan barang','Menjerit','Berlari keluar'],'Membantu ibu'],
['Bahasa','Apakah perkataan yang menunjukkan ahli keluarga?',['ibu','meja','buku','bola'],'ibu'],
['Suku kata','Perkataan "baju" boleh dipecahkan menjadi…',['ba-ju','b-aj-u','b-a-ju','baj-u'],'ba-ju'],
['Membaca','Pilih ayat yang bermula dengan huruf besar dan berakhir dengan noktah.',['saya baca buku','Saya baca buku.','saya Baca Buku.','Saya baca buku'],'Saya baca buku.'],
['Keluarga','Pilih perkataan yang paling sesuai: "Saya sayang ____ saya."',['keluarga','kerusi','pensel','tingkap'],'keluarga']
],
challenge:[
['Cabaran 1','Pilih perkataan yang mempunyai 2 suku kata.',['ayah','keluarga','ibu','bola'],'keluarga'],
['Cabaran 2','Pilih perkataan yang mempunyai huruf vokal a dan u.',['baju','buku','bibi','susu'],'baju'],
['Cabaran 3','Susun menjadi ayat: "sayang / saya / ibu"',['Saya sayang ibu.','Ibu saya sayang.','Sayang ibu saya.','Saya ibu sayang.'],'Saya sayang ibu.'],
['Cabaran 4','Pilih perkataan yang bermula dengan konsonan dan berakhir dengan vokal.',['baju','ibu','ayam','emak'],'baju'],
['Cabaran 5','Pilih ayat yang sesuai dengan tema keluarga penyayang.',['Saya sayang keluarga saya.','Saya buang buku.','Saya lari dari rumah.','Saya tidak membantu.'],'Saya sayang keluarga saya.']
],
checkpoint:[
['1. Vokal','Yang manakah huruf vokal?',['A','B','C','D'],'A'],['2. Vokal','Yang manakah BUKAN vokal?',['a','e','m','u'],'m'],['3. Konsonan','Pilih konsonan.',['i','o','s','a'],'s'],['4. Suku kata','"baju" = ?',['ba-ju','b-aj-u','baj-u','ba-j-u'],'ba-ju'],['5. Perkataan','Pilih ejaan yang betul.',['buku','boko','bukae','biku'],'buku'],['6. Perkataan','Pilih perkataan yang bermula dengan b.',['ibu','baju','emak','ayah'],'baju'],['7. Ayat','Pilih ayat yang betul.',['Ini ibu.','Ini ibu','ini ibu.','Ibu ini'],'Ini ibu.'],['8. Keluarga','Lengkapkan: Saya sayang ____ saya.',['keluarga','meja','bola','buku'],'keluarga'],['9. Suku kata','"bola" = ?',['bo-la','bol-a','b-ola','bo-l-a'],'bo-la'],['10. Nilai','Apakah tindakan penyayang?',['Membantu keluarga','Menyakiti orang','Membuang barang','Menjerit'],'Membantu keluarga']
]};
let state=JSON.parse(localStorage.getItem('ainaUnit1')||'null')||{stars:0,done:[],phase:0};
function save(){localStorage.setItem('ainaUnit1',JSON.stringify(state));updateTop()}
function updateTop(){document.getElementById('stars').textContent=state.stars;document.getElementById('done').textContent=state.done.length;let total=35;let pct=Math.min(100,Math.round(state.done.length/total*100));document.getElementById('pct').textContent=pct;document.getElementById('bar').style.width=pct+'%';document.getElementById('journey').innerHTML=phases.map((p,i)=>`<span class="step ${i===state.phase?'active':''}">${p[1]}</span>`).join('')}
function home(){renderPhase(state.phase)}
function renderPhase(pi){state.phase=pi;save();let key=phases[pi][0];let app=document.getElementById('app');if(key==='reward'){reward();return}if(key==='learn'){app.innerHTML=`<h2>📖 Jom Belajar!</h2><p>Kenali asas membaca dan perkataan mudah dalam Unit 1.</p>${data.learn.map(x=>`<div class="learn"><h3>${x[0]}</h3><p>${x[1]}</p><b>${x[2]}</b></div>`).join('')}<div class="actions"><button class="btn" onclick="renderPhase(1)">Dah faham! Ke Latihan 🎯</button></div>`;return}startQuiz(key)}
function startQuiz(key){let qs=data[key];let i=0,score=0;let app=document.getElementById('app');function show(){let q=qs[i];app.innerHTML=`<h2>${phases[state.phase][1]}</h2><p>Aktiviti ${i+1} daripada ${qs.length}</p><div class="q"><h3>${q[0]}</h3><p>${q[1]}</p><div class="opts">${q[2].map(o=>`<button class="opt" onclick="answer(this,${JSON.stringify(o)},${JSON.stringify(q[3])})">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div></div>`}window.answer=(el,val,correct)=>{let fb=document.getElementById('fb');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(val===correct){el.classList.add('correct');fb.textContent='🌟 Syabas! Jawapan kamu betul!';score++;state.stars++;}else{el.classList.add('wrong');fb.textContent='Hampir betul! Cuba fikir semula. 💪';document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')})}let id=key+'-'+i;if(!state.done.includes(id))state.done.push(id);save();setTimeout(()=>{i++;if(i<qs.length)show();else{app.innerHTML=`<div class="center"><div class="big">🎉</div><h2>Bagus! Aktiviti selesai.</h2><p>Skor kamu: <b>${score}/${qs.length}</b></p><p>⭐ +${score} bintang</p><div class="actions" style="justify-content:center"><button class="btn" onclick="nextPhase()">Teruskan →</button></div></div>`}},750)}show()}
function nextPhase(){if(state.phase<phases.length-1)renderPhase(state.phase+1);else reward()}
function reward(){state.phase=6;save();document.getElementById('app').innerHTML=`<div class="center"><div class="big">🏆</div><h2>Tahniah, Little Learner!</h2><p>Kamu telah melengkapkan perjalanan Unit 1.</p><div class="badge">🌟<br><b>Bintang Keluarga</b><br><small>Unit 1 selesai</small></div><p>Jumlah bintang: ⭐ <b>${state.stars}</b></p><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="resetUnit()">Ulang Unit</button><button class="btn" onclick="renderPhase(0)">Belajar Semula 📖</button></div></div>`}
function resetUnit(){if(confirm('Ulang Unit 1 dan kosongkan progress?')){state={stars:0,done:[],phase:0};save();renderPhase(0)}}
updateTop();renderPhase(state.phase);
</script></body></html>
